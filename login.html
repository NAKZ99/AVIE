<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Agenda Virtual</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="login-container">
        <h2>AGENDA VIRTUAL</h2>
        <h1>Iniciar sesión</h1>
        
        <form id="loginForm" onsubmit="return iniciarSesion(event)">
            <div style="margin-bottom: 15px; text-align: left;">
                <label for="correo" style="display: block; margin-bottom: 5px; font-weight: bold;">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="Ingresa tu correo" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;">
            </div>

            <div style="margin-bottom: 20px; text-align: left;">
                <label for="contrasena" style="display: block; margin-bottom: 5px; font-weight: bold;">Contraseña</label>
                <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;">
            </div>

            <button type="submit">Entrar</button>
        </form>

        <p style="margin-top: 15px; font-size: 14px;">
            ¿No tienes una cuenta? <a href="registro.html" style="color: #2563eb; text-decoration: none; font-weight: bold;">Regístrate aquí</a>
        </p>
    </div>

    <script>
        function iniciarSesion(e) {
            e.preventDefault();
            
            const correoInput = document.getElementById('correo').value.trim().toLowerCase();
            const contrasenaInput = document.getElementById('contrasena').value;

            // Obtener usuarios guardados en localStorage
            const usuariosGuardados = JSON.parse(localStorage.getItem('usuariosAgenda')) || [];

            // Buscar el usuario que coincida con el correo y la contraseña
            const usuarioEncontrado = usuariosGuardados.find(
                u => u.correo === correoInput && u.contrasena === contrasenaInput
            );

            if (!usuarioEncontrado) {
                alert('⚠️ Correo o contraseña incorrectos, o la cuenta no existe.');
                return false;
            }

            // Redirigir según el rol guardado en la cuenta
            if (usuarioEncontrado.rol === 'profesor') {
                window.location.href = 'profesor.html';
            } else if (usuarioEncontrado.rol === 'estudiante') {
                window.location.href = 'estudiante.html';
            } else if (usuarioEncontrado.rol === 'padre') {
                window.location.href = 'padre.html';
            }
        }
    </script>

</body>
</html>
