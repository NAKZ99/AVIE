<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Agenda Virtual</title>
    <style>
        /* Estilos integrados para evitar fallos de rutas */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-container h1 {
            color: #1e3a8a;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .login-container h2 {
            font-size: 20px;
            color: #334155;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #475569;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .footer-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>AVIE</h1>
        <p class="subtitle">Agenda Virtual Institucional Estudiantil</p>
        
        <h2>Iniciar sesión</h2>
        
        <form onsubmit="iniciarSesion(event)">
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="Ingresa tu correo" required>
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" required>
            </div>

            <button type="submit" class="btn">Entrar</button>
        </form>

        <p class="footer-text">
            ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
        </p>
    </div>

    <script>
        function iniciarSesion(e) {
            e.preventDefault();
            const correoInput = document.getElementById('correo').value.trim().toLowerCase();
            const contrasenaInput = document.getElementById('contrasena').value;

            let usuariosGuardados = JSON.parse(localStorage.getItem('usuariosAgenda')) || [];

            const usuarioEncontrado = usuariosGuardados.find(u => u.correo === correoInput && u.contrasena === contrasenaInput);

            if (usuarioEncontrado) {
                localStorage.setItem('usuarioActual', JSON.stringify(usuarioEncontrado));
                alert(`¡Bienvenido de nuevo, ${usuarioEncontrado.nombre}!`);

                if (usuarioEncontrado.rol === 'profesor') {
                    window.location.href = 'profesor.html';
                } else if (usuarioEncontrado.rol === 'estudiante') {
                    window.location.href = 'estudiante.html';
                } else if (usuarioEncontrado.rol === 'padre') {
                    window.location.href = 'padre.html';
                }
            } else {
                alert('⚠️ Correo o contraseña incorrectos, o la cuenta no existe.');
            }
        }
    </script>

</body>
</html>
