<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVIE - Iniciar Sesión</title>
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
    <div class="login-container">
        <h1>AVIE</h1>
        <p class="subtitle">Agenda Virtual Institucional Estudiantil</p>
        
        <h2>Iniciar Sesión</h2>
        <form>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Tu contraseña" required>
            </div>
            
            <button type="submit" class="btn">Ingresar a AVIE</button>
        </form>
        
        <p class="footer-text">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </div>
</body>
</html>
